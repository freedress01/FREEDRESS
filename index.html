<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>联系我们</title>
  <meta name="description" content="填写您的资料，我们会尽快与您联系">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans SC",
        "Microsoft YaHei",
        sans-serif;

      min-height: 100vh;

      background:
        radial-gradient(circle at 10% 10%, rgba(255, 182, 193, 0.35), transparent 35%),
        radial-gradient(circle at 90% 90%, rgba(180, 210, 255, 0.35), transparent 35%),
        linear-gradient(135deg, #fff7f8, #f7f9ff);

      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 16px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border: 1px solid rgba(255, 255, 255, 0.8);

      border-radius: 28px;

      padding: 40px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.08);

      animation: fadeUp 0.6s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 58px;
      height: 58px;

      border-radius: 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;

      background: #111;
      color: white;

      margin-bottom: 22px;
    }

    h1 {
      font-size: 30px;
      line-height: 1.25;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #777;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    .required {
      color: #e35d6a;
    }

    input,
    textarea,
    select {
      width: 100%;

      border: 1px solid #e5e5e5;

      background: #fafafa;

      border-radius: 14px;

      padding: 14px 15px;

      font-size: 15px;

      outline: none;

      transition: all 0.2s ease;

      font-family: inherit;
    }

    input:focus,
    textarea:focus,
    select:focus {
      background: white;

      border-color: #999;

      box-shadow:
        0 0 0 4px rgba(0, 0, 0, 0.04);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 10px;

      margin: 22px 0;

      color: #777;
      font-size: 13px;
      line-height: 1.6;
    }

    .consent input {
      width: 17px;
      height: 17px;
      margin-top: 2px;
      flex-shrink: 0;
    }

    button {
      width: 100%;

      border: none;

      background: #111;
      color: white;

      border-radius: 15px;

      padding: 16px;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

      transition: all 0.2s ease;
    }

    button:hover {
      background: #333;
      transform: translateY(-1px);

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.12);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #message {
      margin-top: 18px;

      text-align: center;

      font-size: 14px;

      line-height: 1.6;

      min-height: 20px;
    }

    .success {
      color: #16834b;
    }

    .error {
      color: #d64545;
    }

    .footer {
      text-align: center;

      margin-top: 20px;

      color: #999;

      font-size: 12px;
    }

    @media (max-width: 520px) {

      body {
        padding: 15px;
      }

      .card {
        padding: 28px 22px;
        border-radius: 24px;
      }

      h1 {
        font-size: 26px;
      }

      .logo {
        width: 52px;
        height: 52px;
      }
    }
  </style>
</head>


<body>

  <div class="container">

    <div class="card">

      <div class="logo">
        ✦
      </div>

      <h1>留下您的资料</h1>

      <p class="subtitle">
        感谢您的关注。请填写以下资料，
        我们会尽快与您联系。
      </p>


      <form id="customerForm">

        <!-- 姓名 -->
        <div class="form-group">

          <label>
            姓名 <span class="required">*</span>
          </label>

          <input
            type="text"
            id="name"
            placeholder="请输入您的姓名"
            required
          >

        </div>


        <!-- 电话 -->
        <div class="form-group">

          <label>
            电话号码 <span class="required">*</span>
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="请输入电话号码"
            required
          >

        </div>


        <!-- Email -->
        <div class="form-group">

          <label>
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="name@example.com"
          >

        </div>


        <!-- WhatsApp -->
        <div class="form-group">

          <label>
            WhatsApp
          </label>

          <input
            type="tel"
            id="whatsapp"
            placeholder="请输入 WhatsApp"
          >

        </div>


        <!-- 需求 -->
        <div class="form-group">

          <label>
            您感兴趣的服务
          </label>

          <select id="service">

            <option value="">
              请选择
            </option>

            <option value="咨询">
              产品咨询
            </option>

            <option value="预约">
              预约服务
            </option>

            <option value="合作">
              商务合作
            </option>

            <option value="其他">
              其他
            </option>

          </select>

        </div>


        <!-- 留言 -->
        <div class="form-group">

          <label>
            其他需求
          </label>

          <textarea
            id="messageText"
            placeholder="请告诉我们您的需求……"
          ></textarea>

        </div>


        <!-- 同意 -->
        <label class="consent">

          <input
            type="checkbox"
            id="consent"
            required
          >

          <span>
            我同意提交以上资料，并允许我们根据我的需求与我联系。
          </span>

        </label>


        <!-- 提交 -->
        <button
          type="submit"
          id="submitButton"
        >
          提交资料
        </button>


        <div id="message"></div>

      </form>

    </div>


    <div class="footer">
      © 2026 Your Company. All rights reserved.
    </div>

  </div>



<script>

  /*
   * ==========================
   * Supabase 配置
   * ==========================
   */

  const SUPABASE_URL =
    "https://ptqukagqumokeytpnrdk.supabase.co";

  const SUPABASE_KEY =
    "把你刚才的 sb_publishable_... 放这里";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /*
   * ==========================
   * 表单提交
   * ==========================
   */

  const form =
    document.getElementById("customerForm");

  const button =
    document.getElementById("submitButton");

  const message =
    document.getElementById("message");


  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      /*
       * 获取资料
       */

      const name =
        document.getElementById("name").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const whatsapp =
        document.getElementById("whatsapp").value.trim();

      const service =
        document.getElementById("service").value;

      const messageText =
        document.getElementById("messageText").value.trim();


      /*
       * 防止重复点击
       */

      button.disabled = true;

      button.innerText = "正在提交…";

      message.innerText = "";


      /*
       * 写入 Supabase
       */

      const { data, error } =
        await supabaseClient
          .from("customers")
          .insert([
            {
              name: name,
              phone: phone,
              email: email,
              whatsapp: whatsapp,

              /*
               * 如果你的数据库暂时没有
               * service 和 message 字段，
               * 先删除下面两行。
               */

              service: service,
              message: messageText
            }
          ]);


      /*
       * 错误处理
       */

      if (error) {

        console.error(error);

        message.className = "error";

        message.innerText =
          "提交失败，请稍后再试。";

        button.disabled = false;

        button.innerText = "提交资料";

        return;
      }


      /*
       * 提交成功
       */

      message.className = "success";

      message.innerText =
        "✓ 提交成功！我们会尽快与您联系。";


      form.reset();

      button.disabled = false;

      button.innerText = "提交资料";

    }

  );

</script>

</body>
</html>
