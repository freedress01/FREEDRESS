<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Salon Information</title>

<meta
name="description"
content="Submit your salon information and our team will get in touch with you."

>

  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(255, 182, 193, 0.35),
          transparent 35%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(180, 210, 255, 0.35),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #fff7f8,
          #f7f9ff
        );

      color: #222;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: rgba(255, 255, 255, 0.90);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border: 1px solid rgba(255, 255, 255, 0.8);

      border-radius: 28px;

      padding: 40px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.08);

      animation: fadeUp 0.6s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 58px;
      height: 58px;

      border-radius: 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;

      background: #111;
      color: white;

      margin-bottom: 22px;
    }

    h1 {
      font-size: 30px;
      line-height: 1.25;

      margin-bottom: 10px;

      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #777;

      font-size: 15px;

      line-height: 1.7;

      margin-bottom: 30px;
    }

    .section-title {
      font-size: 13px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 1px;

      color: #999;

      margin: 28px 0 16px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;

      font-size: 14px;

      font-weight: 600;

      margin-bottom: 8px;

      color: #333;
    }

    .required {
      color: #e35d6a;
    }

    input,
    textarea {
      width: 100%;

      border: 1px solid #e5e5e5;

      background: #fafafa;

      border-radius: 14px;

      padding: 14px 15px;

      font-size: 15px;

      outline: none;

      transition: all 0.2s ease;

      font-family: inherit;
    }

    input:focus,
    textarea:focus {
      background: white;

      border-color: #999;

      box-shadow:
        0 0 0 4px rgba(0, 0, 0, 0.04);
    }

    textarea {
      resize: vertical;

      min-height: 110px;
    }

    .consent {
      display: flex;

      align-items: flex-start;

      gap: 10px;

      margin: 22px 0;

      color: #777;

      font-size: 13px;

      line-height: 1.6;
    }

    .consent input {
      width: 17px;
      height: 17px;

      margin-top: 2px;

      flex-shrink: 0;
    }

    button {
      width: 100%;

      border: none;

      background: #111;

      color: white;

      border-radius: 15px;

      padding: 16px;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

      transition: all 0.2s ease;
    }

    button:hover {
      background: #333;

      transform: translateY(-1px);

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.12);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;

      cursor: not-allowed;

      transform: none;

      box-shadow: none;
    }

    #message {
      margin-top: 18px;

      text-align: center;

      font-size: 14px;

      line-height: 1.6;

      min-height: 20px;
    }

    .success {
      color: #16834b;
    }

    .error {
      color: #d64545;
    }

    .footer {
      text-align: center;

      margin-top: 20px;

      color: #999;

      font-size: 12px;
    }

    @media (max-width: 520px) {

      body {
        padding: 15px;
      }

      .card {
        padding: 28px 22px;

        border-radius: 24px;
      }

      h1 {
        font-size: 26px;
      }

      .logo {
        width: 52px;
        height: 52px;
      }
    }
  </style>

</head>

<body>

  <div class="container">

```
<div class="card">

  <div class="logo">
    ✦
  </div>

  <h1>Salon Information</h1>

  <p class="subtitle">
    Please provide your salon information below.
    Our team will review your details and get
    in touch with you shortly.
  </p>

  <form id="customerForm">

    <!-- Salon Information -->

    <div class="section-title">
      Salon Information
    </div>

    <div class="form-group">

      <label for="salonName">
        Beauty Salon Name
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="salonName"
        placeholder="Enter salon name"
        required
      >

    </div>

    <div class="form-group">

      <label for="storeSize">
        Store Size
      </label>

      <input
        type="text"
        id="storeSize"
        placeholder="e.g. 100 sqm"
      >

    </div>

    <div class="form-group">

      <label for="location">
        Location
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="location"
        placeholder="City / District / Country"
        required
      >

    </div>

    <!-- Contact Information -->

    <div class="section-title">
      Contact Information
    </div>

    <div class="form-group">

      <label for="contactPerson">
        Contact Person
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="contactPerson"
        placeholder="Enter contact person's name"
        required
      >

    </div>

    <div class="form-group">

      <label for="phone">
        Phone Number
        <span class="required">*</span>
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="Enter phone number"
        required
      >

    </div>

    <div class="form-group">

      <label for="whatsapp">
        WhatsApp
      </label>

      <input
        type="tel"
        id="whatsapp"
        placeholder="Enter WhatsApp number"
      >

    </div>

    <div class="form-group">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="name@example.com"
      >

    </div>

    <!-- Additional Information -->

    <div class="section-title">
      Additional Information
    </div>

    <div class="form-group">

      <label for="messageText">
        Additional Message
      </label>

      <textarea
        id="messageText"
        placeholder="Tell us more about your salon or requirements..."
      ></textarea>

    </div>

    <!-- Consent -->

    <label class="consent">

      <input
        type="checkbox"
        id="consent"
        required
      >

      <span>
        I agree to submit the above information
        and allow you to contact me regarding
        my inquiry.
      </span>

    </label>

    <!-- Submit -->

    <button
      type="submit"
      id="submitButton"
    >
      Submit Information
    </button>

    <div id="message"></div>

  </form>

</div>

<div class="footer">
  © 2026 Freedress Company. All rights reserved.
</div>

  </div>

<script>

  /* ==========================================
     SUPABASE CONFIGURATION
     ========================================== */

  const SUPABASE_URL =
    "https://ptqukagqumokeytpnrdk.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_AWtqzy_cWxpfvj2AnQWyOg_mVvF5yOV";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==========================================
     FORM ELEMENTS
     ========================================== */

  const form =
    document.getElementById("customerForm");

  const button =
    document.getElementById("submitButton");

  const message =
    document.getElementById("message");


  /* ==========================================
     SUBMIT FORM
     ========================================== */

  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const salonName =
        document
          .getElementById("salonName")
          .value
          .trim();


      const storeSize =
        document
          .getElementById("storeSize")
          .value
          .trim();


      const location =
        document
          .getElementById("location")
          .value
          .trim();


      const contactPerson =
        document
          .getElementById("contactPerson")
          .value
          .trim();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      const whatsapp =
        document
          .getElementById("whatsapp")
          .value
          .trim();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const messageText =
        document
          .getElementById("messageText")
          .value
          .trim();


      /* Disable button */

      button.disabled = true;

      button.innerText =
        "Submitting...";

      message.className = "";

      message.innerText = "";


      try {

        /* =====================================
           INSERT INTO SUPABASE
           ===================================== */

        const {
          data,
          error
        } = await supabaseClient
          .from("customers")
          .insert([
            {
              salon_name: salonName,
              store_size: storeSize,
              location: location,
              contact_person: contactPerson,
              phone: phone,
              whatsapp: whatsapp,
              email: email,
              message: messageText
            }
          ])
          .select();


        /* =====================================
           SUPABASE ERROR
           ===================================== */

        if (error) {

          console.error(
            "Supabase Error:",
            error
          );

          message.className =
            "error";

          message.innerText =
            "Submission failed: " +
            error.message;

          button.disabled = false;

          button.innerText =
            "Submit Information";

          return;
        }


        /* =====================================
           SUCCESS
           ===================================== */

        console.log(
          "Submission successful:",
          data
        );

        message.className =
          "success";

        message.innerText =
          "✓ Thank you! Your information has been submitted successfully.";


        form.reset();


      } catch (error) {

        /* =====================================
           JAVASCRIPT / NETWORK ERROR
           ===================================== */

        console.error(
          "Unexpected Error:",
          error
        );

        message.className =
          "error";

        message.innerText =
          "Connection error: " +
          error.message;

      }


      button.disabled = false;

      button.innerText =
        "Submit Information";

    }
  );

</script>

</body>
</html>
