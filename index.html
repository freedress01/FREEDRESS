<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Freedress Salon Information</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #464723;
      font-family: Arial, Helvetica, sans-serif;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    /* Banner */
    .banner {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .banner img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Main Card */
    .card {
      background: #ffffff;
      margin: 0;
      padding: 35px 30px 40px;
    }

    /* Section Title */
    .section-title {
      font-size: 20px;
      font-weight: 600;
      margin-top: 30px;
      margin-bottom: 20px;
      color: #464723;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    /* Form Group */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    .required {
      color: #c0392b;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus,
    textarea:focus {
      border-color: #464723;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* Consent */
    .consent {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 25px 0;
      font-size: 13px;
      line-height: 1.5;
      color: #666;
    }

    .consent input {
      width: auto;
      margin-top: 3px;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 15px;
      background: #464723;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 20px;
      color: #ffffff;
      font-size: 12px;
    }

    /* Success Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .modal {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 10px;
      padding: 35px 25px;
      text-align: center;
    }

    .modal h2 {
      margin-top: 0;
      color: #464723;
    }

    .modal p {
      color: #666;
      line-height: 1.6;
    }

    .modal button {
      margin-top: 15px;
      padding: 12px 30px;
      background: #464723;
      color: #ffffff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .card {
        padding: 25px 20px 30px;
      }

      .section-title {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Banner -->
    <div class="banner">
      <img src="banner.jpg" alt="Freedress Beauty Salon Banner">
    </div>

    <!-- Form Card -->
    <div class="card">

      <form id="customerForm">

        <!-- Salon Details -->
        <div class="form-group">
          <label for="salonName">
            Beauty Salon Name <span class="required">*</span>
          </label>
          <input
            type="text"
            id="salonName"
            name="salonName"
            required
            placeholder="Enter salon name"
          >
        </div>

        <div class="form-group">
          <label for="storeSize">
            Store Size
          </label>
          <input
            type="text"
            id="storeSize"
            name="storeSize"
            placeholder="e.g. 100 sqm"
          >
        </div>

        <div class="form-group">
          <label for="location">
            Location <span class="required">*</span>
          </label>
          <input
            type="text"
            id="location"
            name="location"
            required
            placeholder="Enter salon location"
          >
        </div>


        <!-- Contact Information -->
        <div class="section-title">
          Contact Information
        </div>

        <div class="form-group">
          <label for="contactPerson">
            Contact Person <span class="required">*</span>
          </label>
          <input
            type="text"
            id="contactPerson"
            name="contactPerson"
            required
            placeholder="Enter contact person's name"
          >
        </div>

        <div class="form-group">
          <label for="phone">
            Phone Number <span class="required">*</span>
          </label>
          <input
            type="tel"
            id="phone"
            name="phone"
            required
            placeholder="Enter phone number"
          >
        </div>

        <div class="form-group">
          <label for="whatsapp">
            WhatsApp
          </label>
          <input
            type="tel"
            id="whatsapp"
            name="whatsapp"
            placeholder="Enter WhatsApp number"
          >
        </div>

        <div class="form-group">
          <label for="email">
            Email
          </label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter email address"
          >
        </div>


        <!-- Additional Information -->
        <div class="section-title">
          Additional Information
        </div>

        <div class="form-group">
          <label for="message">
            Additional Message
          </label>
          <textarea
            id="message"
            name="message"
            placeholder="Anything else you would like us to know?"
          ></textarea>
        </div>


        <!-- Consent -->
        <div class="consent">
          <input
            type="checkbox"
            id="consent"
            required
          >

          <label for="consent">
            I confirm that the information provided is accurate
            and agree to be contacted regarding this inquiry.
          </label>
        </div>


        <!-- Submit -->
        <button
          type="submit"
          class="submit-btn"
          id="submitBtn"
        >
          Submit Information
        </button>

      </form>

    </div>

    <div class="footer">
      © 2026 Freedress Company. All rights reserved.
    </div>

  </div>


  <!-- Hidden Google Form -->
  <iframe
    name="hidden_iframe"
    id="hidden_iframe"
    style="display:none;"
  ></iframe>


  <!-- Success Modal -->
  <div
    class="modal-overlay"
    id="successModal"
  >
    <div class="modal">

      <h2>Thank You!</h2>

      <p>
        Your information has been submitted successfully.
        Our team will review your details and get in touch
        with you shortly.
      </p>

      <button
        type="button"
        onclick="closeModal()"
      >
        Close
      </button>

    </div>
  </div>


  <script>

    const GOOGLE_FORM_URL =
      "https://docs.google.com/forms/d/e/1FAIpQLScJg1mYA2TCy9VbuAE4PGURc57POKcTNHhrpN3ofSYhX6Zgmw/formResponse";


    document
      .getElementById("customerForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const form = event.target;
        const submitBtn =
          document.getElementById("submitBtn");

        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting...";


        /*
         * Create temporary form
         * and send data to Google Forms
         */

        const googleForm =
          document.createElement("form");

        googleForm.method = "POST";
        googleForm.action = GOOGLE_FORM_URL;
        googleForm.target = "hidden_iframe";
        googleForm.style.display = "none";


        function addField(name, value) {

          const input =
            document.createElement("input");

          input.type = "hidden";
          input.name = name;
          input.value = value || "";

          googleForm.appendChild(input);
        }


        /*
         * Google Form Field Mapping
         */

        addField(
          "entry.1713920276",
          document.getElementById("salonName").value
        );

        addField(
          "entry.951870254",
          document.getElementById("storeSize").value
        );

        addField(
          "entry.30164564",
          document.getElementById("location").value
        );

        addField(
          "entry.1454874061",
          document.getElementById("contactPerson").value
        );

        addField(
          "entry.1900115347",
          document.getElementById("phone").value
        );

        addField(
          "entry.1396736597",
          document.getElementById("whatsapp").value
        );

        addField(
          "entry.1037038169",
          document.getElementById("email").value
        );

        addField(
          "entry.1989603950",
          document.getElementById("message").value
        );


        document.body.appendChild(googleForm);

        googleForm.submit();


        /*
         * Show success message
         */

        setTimeout(function() {

          document.getElementById(
            "successModal"
          ).style.display = "flex";

          form.reset();

          submitBtn.disabled = false;
          submitBtn.textContent =
            "Submit Information";

          googleForm.remove();

        }, 1000);

      });


    function closeModal() {

      document.getElementById(
        "successModal"
      ).style.display = "none";

    }

  </script>

</body>
</html>
